name: Despliegue manual frontend Railway
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frontend-railway-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Publicar producción
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Exigir main y CI del mismo commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Solo se permite desplegar main.');
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (!branch.data.protected) throw new Error('La rama main debe estar protegida antes de desplegar.');
            if (branch.data.commit.sha !== context.sha) throw new Error('main cambió; inicia una nueva ejecución.');
            const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'frontend-ci.yml', branch: 'main', event: 'push', head_sha: context.sha, per_page: 100 });
            const ci = runs.data.workflow_runs.find(run => run.head_sha === context.sha);
            if (!ci || ci.status !== 'completed' || ci.conclusion !== 'success') throw new Error('La última ejecución CI de push para este commit debe haber terminado correctamente.');
            core.notice(`CI verificado: ${ci.html_url}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Desplegar commit verificado
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          test -n "$RAILWAY_TOKEN" && test -n "$RAILWAY_SERVICE_ID"
          railway up . --path-as-root --ci --service "$RAILWAY_SERVICE_ID" --message "frontend $COMMIT_SHA"
      - name: Comprobar endpoint público
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          [[ "$FRONTEND_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?/?$ ]] || { echo 'FRONTEND_URL debe ser un origen HTTPS'; exit 1; }
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors "${FRONTEND_URL%/}/healthz"
          curl --fail --silent --show-error "${FRONTEND_URL%/}/portal-certificados" -o "$RUNNER_TEMP/portal.html"
          grep -q '<app-root' "$RUNNER_TEMP/portal.html"
      - name: Registrar resultado
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### Frontend Railway" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado del job: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
