name: Frontend Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-policy:
    name: Flujo de ramas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar origen del pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/check-branch-policy.cjs

  validate:
    name: TypeScript y pruebas
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/check-branch-policy.test.cjs
      - run: npx tsc --project tsconfig.app.json --noEmit
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - name: Localizar Chrome del runner
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_bin" ]; then
            echo '::error::No se encontro Chrome/Chromium para ejecutar las pruebas.'
            exit 1
          fi
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  docker:
    name: Build de producción
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen sin publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gpc-frontend:local
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Verificar contenedores SSR y Nginx
        run: |
          docker compose -f deploy/docker-compose.dev.yml up --no-build --wait --wait-timeout 120
          docker compose -f deploy/docker-compose.dev.yml exec -T nginx nginx -t
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/ -o "$RUNNER_TEMP/frontend-index.html"
          grep -q '<app-root' "$RUNNER_TEMP/frontend-index.html"
      - name: Logs si falla la comprobacion
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --no-color --tail=100
      - name: Detener solo los contenedores de la prueba
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down
      - name: Guardar exactamente la imagen verificada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save gpc-frontend:local -o "$RUNNER_TEMP/frontend-image.tar"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: frontend-image
          path: ${{ runner.temp }}/frontend-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publicar GHCR
    needs: [branch-policy, validate, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar latest y SHA de la imagen verificada
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker load -i "$RUNNER_TEMP/frontend-image.tar"
          docker tag gpc-frontend:local "$image:sha-$COMMIT_SHA"
          docker tag gpc-frontend:local "$image:latest"
          docker push "$image:sha-$COMMIT_SHA"
          docker push "$image:latest"
          echo "Imagen publicada: $image:sha-$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
