name: Frontend CI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Ejecutar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/check-branch-policy.test.cjs scripts/check-sidebar-icons.test.cjs
      - run: npx tsc --project tsconfig.app.json --noEmit
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - name: Localizar Chrome
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin" || { echo '::error::Chrome no disponible'; exit 1; }
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - run: npm test -- --watch=false --browsers=ChromeHeadless --reporters=dots
  build:
    name: Construir
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -- --configuration production
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: dist/gpc_front/
          if-no-files-found: error
  verify:
    name: Verificar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production
          path: dist/gpc_front/
      - name: Verificar SSR y puerto dinámico
        run: |
          test -s dist/gpc_front/browser/index.html
          test -s dist/gpc_front/server/server.mjs
          PORT=4321 NODE_ENV=production node dist/gpc_front/server/server.mjs > "$RUNNER_TEMP/frontend-ssr.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/frontend-ssr.log"' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 --max-time 10 http://127.0.0.1:4321/healthz
          for route in portal-certificados login; do
            curl -fsSL --max-time 10 "http://127.0.0.1:4321/$route" -o "$RUNNER_TEMP/$route.html"
            grep -q '<app-root' "$RUNNER_TEMP/$route.html"
          done
