name: Frontend CI
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: TypeScript y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/check-branch-policy.test.cjs scripts/check-sidebar-icons.test.cjs
      - run: npx tsc --project tsconfig.app.json --noEmit
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - name: Localizar Chrome
        run: |
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin" || { echo '::error::Chrome no disponible'; exit 1; }
          echo "CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
      - run: npm test -- --watch=false --browsers=ChromeHeadless --reporters=dots
      - run: npm run build -- --configuration production
      - run: test -f dist/gpc_front/browser/index.html && test -f dist/gpc_front/server/server.mjs
  docker:
    name: Build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: gpc-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Verificar SSR y puerto dinámico
        run: |
          docker run -d --name gpc-frontend-ci -e PORT=4321 -p 127.0.0.1:4321:4321 gpc-frontend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4321/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:4321/healthz
          curl -fsS http://127.0.0.1:4321/portal-certificados -o "$RUNNER_TEMP/portal.html"
          curl -fsSL http://127.0.0.1:4321/login -o "$RUNNER_TEMP/login.html"
          grep -q '<app-root' "$RUNNER_TEMP/portal.html"
          grep -q '<app-root' "$RUNNER_TEMP/login.html"
      - if: always()
        run: docker logs gpc-frontend-ci || true
      - if: always()
        run: docker rm -f gpc-frontend-ci || true
