@if (!publico()) {
<app-header #headerLayout>
    <button type="button" class="btn btn-icono btn-sin-borde menu-toggle" popovertarget="menu-principal"
      [attr.aria-label]="pantallaMovil() ? 'Menú de navegación' : sidebarContraido() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      [attr.title]="pantallaMovil() ? 'Menú de navegación' : sidebarContraido() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      aria-controls="menu-principal" [attr.aria-expanded]="pantallaMovil() ? menuMovilAbierto() : !sidebarContraido()"
      (click)="alternarMenu($event)">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
  <ng-content select="[layout-header]" />
</app-header>
<!-- En pantallas angostas el sidebar es un popover (cajón con velo); en escritorio queda fijo. -->
  <app-sidebar id="menu-principal" popover [items]="navigation()"
    [(contraido)]="sidebarContraido" (toggle)="actualizarMenuMovil($event)"
    (click)="$any($event.currentTarget).hidePopover()" />
}
<main [attr.role]="publico() ? 'presentation' : null">
  <ng-content select="[layout-alert]" />
  <router-outlet />
</main>
