<app-header>
    <button type="button" class="btn btn-icono btn-sin-borde menu-toggle menu-movil" popovertarget="menu-principal"
      aria-label="Menú de navegación" aria-controls="menu-principal" [attr.aria-expanded]="menuMovilAbierto()">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
    <button type="button" class="btn btn-icono btn-sin-borde menu-toggle menu-escritorio"
      [attr.aria-label]="sidebarContraido() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      [attr.title]="sidebarContraido() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      aria-controls="menu-principal" [attr.aria-expanded]="!sidebarContraido()"
      (click)="sidebarContraido.set(!sidebarContraido())">
      <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>
  <ng-content select="[layout-header]" />
</app-header>
<!-- En pantallas angostas el sidebar es un popover (cajón con velo); en escritorio queda fijo. -->
<app-sidebar id="menu-principal" popover [items]="navigation()"
  [(contraido)]="sidebarContraido" (toggle)="actualizarMenuMovil($event)"
  (click)="$any($event.currentTarget).hidePopover()" />
<main>
  <router-outlet />
</main>
