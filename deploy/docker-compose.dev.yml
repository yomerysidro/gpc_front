# Build and test the production SSR image locally.
name: gpc-frontend-dev
services:
  frontend:
    image: gpc-frontend:local
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    networks:
      - frontend

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend

networks:
  frontend:
