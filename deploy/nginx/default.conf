server {
    listen 80;
    server_name _;
    server_tokens off;
    # Resolve Docker DNS again after the SSR container is replaced on update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:4000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Proxy the health endpoint so health includes the SSR process.
    location = /healthz {
        proxy_pass $frontend_upstream/healthz;
        access_log off;
    }

    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSR routes must reach Angular's render engine rather than index.html.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
